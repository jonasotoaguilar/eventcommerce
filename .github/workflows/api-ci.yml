name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches:
      - main
    paths:
      - "backend/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventcommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      EVENTCOMMERCE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/eventcommerce
      EVENTCOMMERCE_POSTGRES_USER: postgres
      EVENTCOMMERCE_POSTGRES_PASSWORD: postgres
      EVENTCOMMERCE_POSTGRES_DB: eventcommerce
      EVENTCOMMERCE_POSTGRES_HOST: localhost
      EVENTCOMMERCE_POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Create test database
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE eventcommerce_test;"
        env:
          PGPASSWORD: postgres

      - name: Sync backend dependencies
        run: uv sync --dev
        working-directory: backend

      - name: Run ruff check
        run: uv run ruff check .
        working-directory: backend

      - name: Run ruff format check
        run: uv run ruff format --check .
        working-directory: backend

      - name: Run pyrefly
        run: uv run pyrefly check
        working-directory: backend

      - name: Run pytest
        run: uv run pytest -v
        working-directory: backend
